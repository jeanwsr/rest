name: CI

# Run title: "CI (branch) (commit message)" for sync-* branches,
# default (commit message) for everything else
run-name: >-
  ${{ startsWith(github.ref_name, 'sync/') && format('CI ({0}) ({1})', github.ref_name, github.event.head_commit.message) || github.event.head_commit.message }}

on: [push, pull_request]

# Avoid queued-build pile-up from frequent pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # $REST_HOME is the cargo workspace root (the checkout lives at $REST_HOME/rest)
      REST_HOME: /home/runner/work/rest

    steps:
      # 1. Check out the REST main code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install build-time dependencies via Miniforge
      #    (see rest_doc/source_zh/contributor/compile-guide.md)
      #    Note: build.rs links cint/restmatr/hdf5/rest2fch/openblas/gomp
      #    entirely from $REST_EXT_DIR; libxc is dynamically loaded at runtime
      #    and not linked at build time.
      - name: Install Miniforge and build deps
        run: |
          set -euo pipefail
          CONDA_DIR="$HOME/miniforge3"
          curl -fsSL --retry 3 -o /tmp/miniforge.sh \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
          bash /tmp/miniforge.sh -b -p "$CONDA_DIR"
          CONDA="$CONDA_DIR/bin/conda"
          # simple-dftd3/dftd4/geometric are runtime Python deps required by the
          # regression suite (dispersion / TRIC-optimizer cases import them via
          # REST's Python bridge); the build itself does not link them
          $CONDA create -y -p "$CONDA_DIR/envs/rest-dev" \
            python=3.11 numpy scipy h5py \
            "libopenblas=*=*openmp*" \
            libxc libcint hdf5 openmpi gfortran libclang \
            simple-dftd3 dftd4 geometric mokit \
            -c conda-forge -c mokit
          echo "CONDA_PREFIX=$CONDA_DIR/envs/rest-dev" >> "$GITHUB_ENV"
          echo "$CONDA_DIR/envs/rest-dev/bin" >> "$GITHUB_PATH"

      # 3. Gitee SSH key: Gitee's HTTP rate limiting (429) for GitHub runner IPs
      #    does not affect the SSH transport
      - name: Set up Gitee SSH
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          ssh-keyscan -t ed25519,rsa gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host gitee.com\n  IdentityFile ~/.ssh/gitee_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config

      # 4. Assemble the $REST_HOME workspace layout (compile-guide, step 2)
      #    Gitee throttles GitHub runner IPs intermittently, hence the retries
      - name: Assemble $REST_HOME workspace
        run: |
          set -euo pipefail
          clone_retry() {
            local i url="$1" dest
            dest=$(basename "$url" .git)
            for i in 1 2 3; do
              git clone --depth 1 "$url" "$dest" && return 0
              echo "::warning::git clone failed (attempt ${i}/3), retrying ..."
              if [ "$i" -lt 3 ]; then sleep $((i * 10)); fi
            done
            return 1
          }
          cd "$REST_HOME"
          clone_retry git@gitee.com:restgroup/rest_workspace.git
          cp rest_workspace/Cargo.toml .
          clone_retry git@gitee.com:restgroup/rest_tensors.git
          clone_retry git@gitee.com:restgroup/rest_libcint.git
          clone_retry git@gitee.com:restgroup/rest_regression.git
          mkdir -p deps
          echo "REST_EXT_DIR=$REST_HOME/deps" >> "$GITHUB_ENV"

      # 5. Link libraries into $REST_EXT_DIR (compile-guide, step 4)
      - name: Link libraries into $REST_EXT_DIR
        run: |
          set -euo pipefail
          cd "$REST_EXT_DIR"
          for pattern in libcint libxc libmpi libhdf5 libopenblas libgomp libpython; do
            for lib in "$CONDA_PREFIX"/lib/${pattern}*.so; do
              if [ -e "$lib" ]; then ln -sf "$lib" .; fi
            done
          done
          # librest2fch.so ships with the mokit package under python site-packages
          ln -sf "$CONDA_PREFIX"/lib/python3.11/site-packages/mokit/lib/librest2fch.so .
          # some conda distributions lack libopenblas.so; fall back to libopenblas.0.so
          [ -e libopenblas.so ] || ln -sf libopenblas.0.so libopenblas.so
          echo "LD_LIBRARY_PATH=$REST_EXT_DIR:$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "HDF5_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "REST_FORTRAN_COMPILER=gfortran" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"

      # 6. Cache cargo artifacts
      #    rust-cache restores target/ to the workspace root correctly (actions/cache
      #    extracts relative to the checkout dir), prunes workspace-own + incremental
      #    artifacts to stay small, and keys on the rustc version automatically
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: /home/runner/work/rest
          cache-on-failure: true

      # 7. Build (release; rest_tensors' build.rs compiles restmatr.f90 -> librestmatr.so)
      - name: Build (release)
        run: |
          set -euo pipefail
          cd "$REST_HOME"
          cargo build -p rest --release
          # Link integrity check: no unresolved shared libraries allowed
          if ldd target/release/rest | grep -q "not found"; then
            echo "::error::unresolved shared libraries:"
            ldd target/release/rest | grep "not found"
            exit 1
          fi

      # 8. Test: run regression
      - name: Test
        run: |
          set -euo pipefail
          cd "$REST_HOME/rest_regression"
          cargo run -- -t 4

      # 9. Upload regression logs as artifacts when any step failed
      #    (same pattern as rest-feedstock/.github/workflows/conda_rattler.yml)
      - name: Upload regression logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.REST_HOME }}/rest_regression/work_pool/**
          if-no-files-found: ignore
